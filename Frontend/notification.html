<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tool 6 — Customer Notification</title>
    <link rel="stylesheet" href="common/style.css">
</head>
<body>

<div class="header">
    <div class="header-left">
        <h1>📧 Customer Notification</h1>
        <span class="tool-badge">Tool 6 / 6</span>
    </div>
    <a href="index.html">← Back to Dashboard</a>
</div>

<div class="container">
    <div class="card">
        <h2>Send Notification</h2>
        <p class="card-desc">
            Sends an order confirmation message to the customer via email.
            Returns delivery status.
        </p>

        <div class="form-group">
            <label>Customer ID</label>
            <input type="text" id="customerId" value="CUST-1001">
        </div>

        <div class="form-group">
            <label>Message</label>
            <textarea id="message">Your order ORD-10001 has been processed. Invoice: INV-10001. Tracking: TRK123456789.</textarea>
        </div>

        <div class="form-group fault-row">
            <label>Fault:</label>
            <select class="fault-select" id="fault">
                <option value="">None (normal)</option>
                <option value="unavailable">Service Unavailable</option>
                <option value="timeout">Timeout</option>
                <option value="error">Service Error</option>
                <option value="invalid">Invalid Response</option>
            </select>
        </div>

        <button class="btn btn-primary" id="runBtn">Send Notification</button>
    </div>

    <div class="card">
        <h2>Response</h2>
        <div class="result-box" id="resultBox"></div>
    </div>
</div>

<script src="common/shared.js"></script>
<script>
setupToolButton("runBtn", "resultBox", "/api/tool/notification", () => ({
    customer_id: document.getElementById("customerId").value,
    message: document.getElementById("message").value,
    fault: document.getElementById("fault").value || null,
}));
</script>

</body>
</html>
