<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tool 1 — Order Management</title>
    <link rel="stylesheet" href="common/style.css">
</head>
<body>

<div class="header">
    <div class="header-left">
        <h1>🛒 Order Management System</h1>
        <span class="tool-badge">Tool 1 / 6</span>
    </div>
    <a href="index.html">← Back to Dashboard</a>
</div>

<div class="container">
    <div class="card">
        <h2>Create Order</h2>
        <p class="card-desc">
            Creates a new order in the order management system for the given customer and items.
            Returns an order ID that downstream tools use.
        </p>

        <div class="form-group">
            <label>Customer ID</label>
            <input type="text" id="customerId" value="CUST-1001">
        </div>

        <div class="form-group">
            <label>Items (comma-separated)</label>
            <input type="text" id="items" value="Laptop, Mouse, Keyboard">
        </div>

        <div class="form-group fault-row">
            <label>Fault:</label>
            <select class="fault-select" id="fault">
                <option value="">None (normal)</option>
                <option value="unavailable">Service Unavailable</option>
                <option value="timeout">Timeout</option>
                <option value="error">Service Error</option>
                <option value="invalid">Invalid Response</option>
            </select>
        </div>

        <button class="btn btn-primary" id="runBtn">Create Order</button>
    </div>

    <div class="card">
        <h2>Response</h2>
        <div class="result-box" id="resultBox"></div>
    </div>
</div>

<script src="common/shared.js"></script>
<script>
setupToolButton("runBtn", "resultBox", "/api/tool/order", () => ({
    customer_id: document.getElementById("customerId").value,
    items: document.getElementById("items").value.split(",").map(s => s.trim()),
    fault: document.getElementById("fault").value || null,
}));
</script>

</body>
</html>
