<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tool 5 — Delivery Service</title>
    <link rel="stylesheet" href="common/style.css">
</head>
<body>

<div class="header">
    <div class="header-left">
        <h1>🚚 Delivery Service</h1>
        <span class="tool-badge">Tool 5 / 6</span>
    </div>
    <a href="index.html">← Back to Dashboard</a>
</div>

<div class="container">
    <div class="card">
        <h2>Arrange Delivery</h2>
        <p class="card-desc">
            Schedules delivery with the carrier and generates a tracking number.
            Returns tracking info and estimated delivery time.
        </p>

        <div class="form-group">
            <label>Order ID</label>
            <input type="text" id="orderId" value="ORD-10001">
        </div>

        <div class="form-group">
            <label>Customer ID</label>
            <input type="text" id="customerId" value="CUST-1001">
        </div>

        <div class="form-group fault-row">
            <label>Fault:</label>
            <select class="fault-select" id="fault">
                <option value="">None (normal)</option>
                <option value="unavailable">Service Unavailable</option>
                <option value="timeout">Timeout</option>
                <option value="error">Service Error</option>
                <option value="invalid">Invalid Response</option>
            </select>
        </div>

        <button class="btn btn-primary" id="runBtn">Arrange Delivery</button>
    </div>

    <div class="card">
        <h2>Response</h2>
        <div class="result-box" id="resultBox"></div>
    </div>
</div>

<script src="common/shared.js"></script>
<script>
setupToolButton("runBtn", "resultBox", "/api/tool/delivery", () => ({
    order_id: document.getElementById("orderId").value,
    customer_id: document.getElementById("customerId").value,
    fault: document.getElementById("fault").value || null,
}));
</script>

</body>
</html>
